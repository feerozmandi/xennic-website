name: Website checks and preview image

on:
  pull_request:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # Build-only placeholders; no database is contacted or real secret used.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      PAYLOAD_SECRET: ci-only-placeholder-not-a-production-secret
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Compatibility tests
        run: npm run test:compat
      - name: Preview configuration tests
        run: npm run test:preview-config
      - name: Deployment protocol tests
        run: |
          python3 tests/preview-deploy-manifest.py
          python3 tests/preview-deploy-client.py
          python3 tests/preview-deploy-receiver.py
          python3 tests/preview-deploy-lock.py
      - name: Build
        run: npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      COMPOSE_PROJECT_NAME: xennic-ci-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_USER: xennic_ci
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: xennic_ci
      DATABASE_URL: postgresql://xennic_ci:ci-only-password@127.0.0.1:5432/xennic_ci
      PAYLOAD_SECRET: ci-only-placeholder-not-a-production-secret
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Write test-only environment
        run: |
          printf 'POSTGRES_USER=%s\nPOSTGRES_PASSWORD=%s\nPOSTGRES_DB=%s\nDATABASE_URL=%s\nPAYLOAD_SECRET=%s\n' \
            "$POSTGRES_USER" "$POSTGRES_PASSWORD" "$POSTGRES_DB" "$DATABASE_URL" "$PAYLOAD_SECRET" > .env
      - name: Start and wait for healthy Compose services
        run: docker compose up -d --wait --wait-timeout 120
      - name: Initialize schemas
        run: npm run db:init
      - name: Seed approved content
        run: npm run seed
      - name: Start development server
        run: |
          npm run dev -- --hostname 127.0.0.1 > "$RUNNER_TEMP/xennic-next.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/xennic-next.pid"
          node scripts/wait-for-server.mjs
      - name: Run smoke tests
        run: npm run test:smoke
      - name: Show server log on failure
        if: failure()
        run: test ! -f "$RUNNER_TEMP/xennic-next.log" || cat "$RUNNER_TEMP/xennic-next.log"
      - name: Stop server and Compose
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/xennic-next.pid"; then kill "$(cat "$RUNNER_TEMP/xennic-next.pid")" || true; fi
          docker compose down --volumes --remove-orphans

  production-preview:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: xennic-preview-ci
      PREVIEW_POSTGRES_DB: preview_ci
      PREVIEW_POSTGRES_USER: preview_ci
      PREVIEW_POSTGRES_PASSWORD: ci-only-preview-password
      PREVIEW_DATABASE_URL: postgresql://preview_ci:ci-only-preview-password@postgres:5432/preview_ci
      PREVIEW_PAYLOAD_SECRET: ci-only-preview-secret-not-for-real-use
      PREVIEW_PORT: '3000'
      PREVIEW_ORIGIN: https://preview.xennic.ir
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build and test isolated production preview
        run: bash scripts/ci-preview.sh

  publish-preview-image:
    # No package write permission or registry login is given to PR runs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [checks, compose-smoke, production-preview]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the commit image
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile.preview
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
      - name: Set up Node.js for the published-image test
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Test the published digest without rebuilding
        env:
          COMPOSE_PROJECT_NAME: xennic-preview-ci
          PREVIEW_POSTGRES_DB: preview_ci
          PREVIEW_POSTGRES_USER: preview_ci
          PREVIEW_POSTGRES_PASSWORD: ci-only-preview-password
          PREVIEW_DATABASE_URL: postgresql://preview_ci:ci-only-preview-password@postgres:5432/preview_ci
          PREVIEW_PAYLOAD_SECRET: ci-only-preview-secret-not-for-real-use
          PREVIEW_PORT: '3000'
          PREVIEW_ORIGIN: https://preview.xennic.ir
          PREVIEW_TEST_IMAGE: ${{ steps.image.outputs.name }}@${{ steps.publish.outputs.digest }}
        run: bash scripts/ci-preview.sh
      - name: Record the tested immutable image reference
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          COMMIT: ${{ github.sha }}
        run: |
          {
            echo '### Preview image published and tested by digest (not deployed)'
            echo "- Commit: \`$COMMIT\`"
            echo "- Tag: \`$IMAGE:sha-$COMMIT\`"
            echo "- Immutable reference: \`$IMAGE@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
