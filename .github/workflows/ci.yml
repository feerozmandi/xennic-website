name: Website checks and preview image

on:
  pull_request:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # Build-only placeholders; no database is contacted or real secret used.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      PAYLOAD_SECRET: ci-only-placeholder-not-a-production-secret
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Architecture boundaries
        run: npm run check:boundaries
      - name: Compatibility tests
        run: npm run test:compat
      - name: Preview configuration tests
        run: npm run test:preview-config
      - name: Age backup format tests
        run: python3 tests/preview-age-backup.py
      - name: Deployment protocol tests
        run: |
          python3 tests/preview-deploy-manifest.py
          python3 tests/preview-release-evidence.py
          python3 tests/preview-release-verifier.py
          python3 tests/preview-pull-image.py
          python3 tests/preview-deploy-client.py
          python3 tests/preview-deploy-receiver.py
          python3 tests/preview-deploy-lock.py
          python3 tests/preview-deploy-state.py
          python3 tests/preview-deploy-readiness.py
          python3 tests/preview-deploy-transaction.py
          python3 tests/preview-deploy-backend.py
          python3 tests/preview-compose-operations.py
          python3 tests/preview-internal-health.py
          python3 tests/preview-network-topology.py
          python3 tests/preview-installer-apex.py
          python3 tests/preview-installer-scope.py
          python3 tests/preview-ci-gateway.py
          python3 tests/preview-ci-evidence.py
          python3 tests/preview-pull-deploy.py
      - name: Build
        run: npm run build
      - name: Client bundle secret check
        run: npm run check:bundle

  compose-smoke:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      COMPOSE_PROJECT_NAME: xennic-ci-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_USER: xennic_ci
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: xennic_ci
      DATABASE_URL: postgresql://xennic_ci:ci-only-password@127.0.0.1:5432/xennic_ci
      PAYLOAD_SECRET: ci-only-placeholder-not-a-production-secret
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Write test-only environment
        run: |
          printf 'POSTGRES_USER=%s\nPOSTGRES_PASSWORD=%s\nPOSTGRES_DB=%s\nDATABASE_URL=%s\nPAYLOAD_SECRET=%s\n' \
            "$POSTGRES_USER" "$POSTGRES_PASSWORD" "$POSTGRES_DB" "$DATABASE_URL" "$PAYLOAD_SECRET" > .env
      - name: Start and wait for healthy Compose services
        run: docker compose up -d --wait --wait-timeout 120
      - name: Initialize schemas
        run: npm run db:init
      - name: Seed approved content
        run: npm run seed
      - name: Start development server
        run: |
          npm run dev -- --hostname 127.0.0.1 > "$RUNNER_TEMP/xennic-next.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/xennic-next.pid"
          node scripts/wait-for-server.mjs
      - name: Run smoke tests
        run: npm run test:smoke
      - name: Show server log on failure
        if: failure()
        run: test ! -f "$RUNNER_TEMP/xennic-next.log" || cat "$RUNNER_TEMP/xennic-next.log"
      - name: Stop server and Compose
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/xennic-next.pid"; then kill "$(cat "$RUNNER_TEMP/xennic-next.pid")" || true; fi
          docker compose down --volumes --remove-orphans

  installed-sftp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install disposable fixture dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y openssh-server age nginx openssl python3-msgpack python3-lz4 python3-cryptography
      - name: Install and exercise the root-owned preview helpers
        run: |
          if ! bash tests/preview-sftp-installed-ci.sh > "$RUNNER_TEMP/installed-preview-ci.log" 2>&1; then
            tail -n 40 "$RUNNER_TEMP/installed-preview-ci.log"
            details=$(tail -n 25 "$RUNNER_TEMP/installed-preview-ci.log" | tr '\n' ';' | cut -c1-5000)
            echo "::error::Disposable fixture failure: $details"
            exit 1
          fi
          tail -n 15 "$RUNNER_TEMP/installed-preview-ci.log"

  installer-upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Exercise bounded installer upgrade and rollback on disposable runner
        run: bash tests/preview-installer-upgrade-ci.sh

  production-preview:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: xennic-preview-ci
      PREVIEW_POSTGRES_DB: preview_ci
      PREVIEW_POSTGRES_USER: preview_ci
      PREVIEW_POSTGRES_PASSWORD: ci-only-preview-password
      PREVIEW_DATABASE_URL: postgresql://preview_ci:ci-only-preview-password@postgres:5432/preview_ci
      PREVIEW_PAYLOAD_SECRET: ci-only-preview-secret-not-for-real-use
      PREVIEW_PORT: '3000'
      PREVIEW_ORIGIN: https://preview.xennic.ir
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install age for disposable backup test
        run: sudo apt-get update -qq && sudo apt-get install -y age
      - name: Build and test isolated production preview
        run: bash scripts/ci-preview.sh

  # ---------------------------------------------------------------------------
  # Automated deployment of `dev` to the preview host.
  #
  # Two jobs on purpose:
  #   deploy-preflight  read-only. It proves which release is live, whether the
  #                     reviewed migration transition for this candidate exists,
  #                     and writes that to the run summary BEFORE anyone is
  #                     asked to approve anything.
  #   deploy-dev        gated by the `production-deploy` environment, so a
  #                     human (the owner) has to approve this specific run.
  #                     It runs the existing guarded transaction only — no new
  #                     path, no skipped phase.
  #
  # This push path is off unless the repository variable DEPLOY_PUSH_SSH is
  # `enabled`. It is not the supported path any more: GitHub's runners cannot
  # open either the deploy port or port 22 on this host, so the host pulls
  # instead (`ci-pull-deploy` + a systemd timer, see
  # docs/reports/2026-11-12-pull-deploy.md). Keep it off; it stays in the tree
  # because the workflow and the gateway are still the manual/emergency route.
  # ---------------------------------------------------------------------------
  deploy-preflight:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && vars.DEPLOY_PUSH_SSH == 'enabled'
    needs: [publish-preview-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fetch the published release evidence
        uses: actions/download-artifact@v6
        with:
          name: xennic-preview-release-${{ github.run_attempt }}
          path: release-evidence
      - name: Bind the evidence to this run
        run: |
          python3 - <<'PY' > manifest.json
          import json, pathlib
          data = json.loads(pathlib.Path('release-evidence/xennic-preview-release.json').read_text())
          print(json.dumps(data['release'], separators=(',', ':'), sort_keys=True))
          PY
          cat manifest.json
      - name: Prepare the deploy key
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Check the host is reachable from the runner
        id: reach
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
        run: |
          set -uo pipefail
          : "${VPS_HOST:?repository variable VPS_HOST is not set}"
          port="${VPS_PORT:-22}"
          probe() { timeout 15 bash -c "exec 3<>/dev/tcp/$1/$2" 2>/dev/null; }
          # The runner's own address is the one value the host-side firewall
          # needs, so record it before anything else can fail.
          egress=$(curl -fsS --max-time 10 https://api.ipify.org 2>/dev/null || echo unknown)
          echo "target       : $VPS_HOST:$port"
          echo "runner egress: $egress"
          echo "- runner egress \`$egress\` tried \`$VPS_HOST:$port\`" >> "$GITHUB_STEP_SUMMARY"
          if probe "$VPS_HOST" "$port"; then
            echo "TCP $VPS_HOST:$port is reachable from this runner."
            echo "- \`$VPS_HOST:$port\` reachable from \`$egress\`" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::No TCP connection to $VPS_HOST:$port within 15 seconds from $egress."
          # Port 22 tells us whether one port is filtered or the whole address is.
          for alt in 22 33878; do
            [ "$alt" = "$port" ] && continue
            if probe "$VPS_HOST" "$alt"; then
              echo "- port $alt IS reachable while $port is not: the block is per-port."
            else
              echo "- port $alt is not reachable either: this runner cannot reach the host at all."
            fi
          done
          echo "Nothing was changed on the server."
          echo "- If only $port is filtered, the host firewall (ufw, Plesk firewall, provider panel) is dropping it for this address."
          echo "- If every port is filtered, the provider or a fail2ban/ipset ban is dropping this address; allow the ranges from"
          echo "  https://api.github.com/meta (field \`actions\`) or unban $egress."
          echo "- On the host, one command answers everything:"
          echo "  { ss -lntp | grep -E ':${port}|:22'; ufw status verbose; iptables -S | head -30; fail2ban-client status sshd; } 2>&1 | tee /tmp/net-diag.txt"
          exit 1
      - name: Read the live state (read-only)
        id: preflight
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
        run: |
          set -euo pipefail
          report=$(ssh -i "$HOME/.ssh/id_ed25519" -p "${VPS_PORT:-22}" -o BatchMode=yes \
            -o IdentitiesOnly=yes -o ConnectTimeout=20 -o ConnectionAttempts=1 \
            -o StrictHostKeyChecking=yes "deploy@$VPS_HOST" preflight < manifest.json)
          echo "report=$report" >> "$GITHUB_OUTPUT"
          echo "$report"
      - name: Explain the next step
        env:
          REPORT: ${{ steps.preflight.outputs.report }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          report = json.loads(os.environ['REPORT'])
          print('### Deployment preflight')
          print(f"- Live now: run {report['current_run_number']} (`{report['current_commit']}`)")
          print(f"- Candidate: run {report['candidate_run_number']} (`{report['candidate_commit']}`)")
          if report['transition_approved']:
              print('- Reviewed migration transition: **present** — approving this run deploys.')
          else:
              print('- Reviewed migration transition: **missing** — approve it first:')
              print('  ```')
              print('  gh workflow run approve-release.yml --repo feerozmandi/xennic-website \\')
              print('    -f run_id=<this run id> \\')
              print("    -f previous_migrations='[\"<names from the live database>\"]' \\")
              print('    -f migration_sha256=0000...0000')
              print('  ```')
              print('- The approve run prints the migration hash it computed from the image;')
              print('  its second dispatch carries that hash back, so no hash is ever typed by hand.')
          PY

  deploy-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && vars.DEPLOY_PUSH_SSH == 'enabled'
    needs: [deploy-preflight]
    runs-on: ubuntu-latest
    environment:
      name: production-deploy
      url: https://xennic.ir
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Fetch the published release evidence
        uses: actions/download-artifact@v6
        with:
          name: xennic-preview-release-${{ github.run_attempt }}
          path: release-evidence
      - name: Bind the evidence to this run
        run: |
          set -euo pipefail
          python3 scripts/preview-ci-evidence.py --run-id "$GITHUB_RUN_ID" --commit "$GITHUB_SHA" \
            --run-number "$GITHUB_RUN_NUMBER" \
            < release-evidence/xennic-preview-release.json > manifest.json
          cat manifest.json
      - name: Prepare the deploy key
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Check the host is reachable from the runner
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
        run: |
          set -uo pipefail
          : "${VPS_HOST:?repository variable VPS_HOST is not set}"
          port="${VPS_PORT:-22}"
          probe() { timeout 15 bash -c "exec 3<>/dev/tcp/$1/$2" 2>/dev/null; }
          egress=$(curl -fsS --max-time 10 https://api.ipify.org 2>/dev/null || echo unknown)
          echo "target       : $VPS_HOST:$port"
          echo "runner egress: $egress"
          if probe "$VPS_HOST" "$port"; then
            echo "TCP $VPS_HOST:$port is reachable from this runner."
            exit 0
          fi
          echo "::error::No TCP connection to $VPS_HOST:$port within 15 seconds from $egress; nothing was changed."
          exit 1
      - name: Release check (read-only)
        id: release_check
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -p "${VPS_PORT:-22}" -o BatchMode=yes \
            -o IdentitiesOnly=yes -o ConnectTimeout=20 -o ConnectionAttempts=1 \
            -o StrictHostKeyChecking=yes "deploy@$VPS_HOST" release-check < manifest.json
      - name: Deploy
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -p "${VPS_PORT:-22}" -o BatchMode=yes \
            -o IdentitiesOnly=yes -o ConnectTimeout=20 -o ConnectionAttempts=1 \
            -o StrictHostKeyChecking=yes "deploy@$VPS_HOST" deploy < manifest.json
      - name: Verify the public pages
        id: verify
        run: |
          set -u
          failures=0
          for path in / /en /services /contact /health; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://xennic.ir$path" || echo 000)
            echo "- \`$path\` → \`$code\`" >> "$GITHUB_STEP_SUMMARY"
            [ "$code" = "200" ] || failures=$((failures + 1))
          done
          [ "$failures" -eq 0 ]
      - name: Report a failed deployment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh issue create --repo "$GITHUB_REPOSITORY" --label deploy-failed \
            --title "Deployment of ${{ github.sha }} failed" \
            --body "The automated deployment of \`${{ github.sha }}\` (run ${{ github.run_number }}) failed. Every step logs the phase that stopped; the server is left in whatever state the guarded transaction recorded, and \`release-state.json\` on the host is the source of truth. Run: $RUN_URL"
      - name: Close the matching issue after a successful deployment
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for number in $(gh issue list --repo "$GITHUB_REPOSITORY" --label deploy-failed --state open \
            --search "${{ github.sha }} in:title" --json number --jq '.[].number'); do
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Deployed successfully in run ${{ github.run_number }}."
          done

  publish-preview-image:
    # No package write permission or registry login is given to PR runs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [checks, compose-smoke, production-preview, installed-sftp, installer-upgrade]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the commit image
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile.preview
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
      - name: Set up Node.js for the published-image test
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Install age for disposable backup test
        run: sudo apt-get update -qq && sudo apt-get install -y age
      - name: Test the published digest without rebuilding
        env:
          COMPOSE_PROJECT_NAME: xennic-preview-ci
          PREVIEW_POSTGRES_DB: preview_ci
          PREVIEW_POSTGRES_USER: preview_ci
          PREVIEW_POSTGRES_PASSWORD: ci-only-preview-password
          PREVIEW_DATABASE_URL: postgresql://preview_ci:ci-only-preview-password@postgres:5432/preview_ci
          PREVIEW_PAYLOAD_SECRET: ci-only-preview-secret-not-for-real-use
          PREVIEW_PORT: '3000'
          PREVIEW_ORIGIN: https://preview.xennic.ir
          PREVIEW_TEST_IMAGE: ${{ steps.image.outputs.name }}@${{ steps.publish.outputs.digest }}
        run: bash scripts/ci-preview.sh
      - name: Test installed GHCR pull helper with published digest
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tests/preview-ghcr-pull-published-ci.sh
      - name: Prepare same-run release evidence
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: python3 scripts/preview-release-evidence.py > "$RUNNER_TEMP/xennic-preview-release.json"
      - name: Preserve same-run release evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: xennic-preview-release-${{ github.run_attempt }}
          path: ${{ runner.temp }}/xennic-preview-release.json
          if-no-files-found: error
          retention-days: 90
      - name: Record the tested immutable image reference
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          COMMIT: ${{ github.sha }}
        run: |
          {
            echo '### Preview image published and tested by digest (not deployed)'
            echo "- Commit: \`$COMMIT\`"
            echo "- Tag: \`$IMAGE:sha-$COMMIT\`"
            echo "- Immutable reference: \`$IMAGE@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
